name: CI/CD Pipeline
# Full pipeline: lint + secrets + code scan -> build -> image scan -> ECR push
on:
  push: { branches: [ main ] }
  workflow_dispatch:

permissions:
  id-token: write        # needed because this repo pushes to ECR
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: impressico-testingwork/shared_repo/.github/actions/lint-workflows@main

  secrets-scan:
    uses: impressico-testingwork/shared_repo/.github/workflows/secrets-scan.yml@main
    with: { fail-on-findings: false }

  code-scan:
    uses: impressico-testingwork/shared_repo/.github/workflows/code-scan.yml@main
    with: { fail-on-findings: true }

  build:
    needs: [lint, secrets-scan, code-scan]     # gate: build only if all pass
    uses: impressico-testingwork/shared_repo/.github/workflows/docker-build.yml@main
    with:
      image-name: poc-microservice-node

  scan:
    needs: build
    uses: impressico-testingwork/shared_repo/.github/workflows/image-scan.yml@main
    with:
      image-artifact: ${{ needs.build.outputs.image-artifact }}
      image-ref:      ${{ needs.build.outputs.image-ref }}
      trivy-exit-code: "0"

  push:
    needs: [build, scan]
    uses: impressico-testingwork/shared_repo/.github/workflows/ecr-push.yml@main
    with:
      image-artifact: ${{ needs.build.outputs.image-artifact }}
      image-ref:      ${{ needs.build.outputs.image-ref }}
      aws-region: us-east-1
      role-arn: arn:aws:iam::140056267289:role/github-actions-oidc
      ecr-repository: poc-microservice-node
      ensure-ecr-repo: true
